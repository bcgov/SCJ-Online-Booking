fullnameOverride: scjob-crunchy

postgresVersion: 17

instances:
  name: postgres
  replicas: 2
  dataVolumeClaimSpec:
    storage: 2Gi
  requests:
    cpu: 100m

pgBackRest:
  retention: "30" # Ideally a larger number such as 30 backups/days
  repos:
    volume:
      storage: 2Gi
    schedules:
      full: 17 8 * * *
      incremental: 17 0,4,12,16,20 * * *
  s3:
    enabled: true
    bucket: "ag-pssg-bccourts-scjob-prod-bkt"
    endpoint: "ag-pssg-sharedservices.objectstore.gov.bc.ca"
    fullSchedule: "17 9 * * *"
    incrementalSchedule: "17 1,5,13,17,21 * * *"

proxy:
  pgBouncer:
    replicas: 1

pgmonitor:
  namespace: bc7c5c #The high level namespace of your project without the -tools -dev, etc part.
