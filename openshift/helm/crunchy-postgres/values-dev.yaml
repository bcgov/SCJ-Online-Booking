fullnameOverride: scjob-crunchy

postgresVersion: 17

instances:
  name: postgres
  replicas: 1
  dataVolumeClaimSpec:
    storage: 2Gi
  requests:
    cpu: 100m

pgBackRest:
  repos:
    volume:
      storage: 1Gi
  s3:
    enabled: true
    bucket: "ag-pssg-bccourts-scjob-dev-bkt"
    endpoint: "ag-pssg-sharedservices.objectstore.gov.bc.ca"

proxy:
  pgBouncer:
    replicas: 1

pgmonitor:
  namespace: bc7c5c #The high level namespace of your project without the -tools -dev, etc part.
