fullnameOverride: scjob-crunchy

postgresVersion: 17

instances:
  name: postgres
  replicas: 1
  dataVolumeClaimSpec:
    storage: 2Gi
  requests:
    cpu: 100m

pgBackRest:
  retention: "30"
  repos:
    volume:
      storage: 1Gi
    schedules:
      full: 17 8 * * *
      incremental: 17 0,4,12,16,20 * * *
  s3:
    enabled: false
    bucket: "ag-pssg-bccourts-scjob-dev-bkt"
    endpoint: "ag-pssg-sharedservices.objectstore.gov.bc.ca"
    fullSchedule: "17 9 * * *"
    incrementalSchedule: "17 1,5,13,17,21 * * *"

proxy:
  pgBouncer:
    replicas: 1

pgmonitor:
  namespace: bc7c5c #The high level namespace of your project without the -tools -dev, etc part.
